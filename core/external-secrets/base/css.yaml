# > A list of all cluster stores for doppler projects
---
# ClusterSecretStore for Cloud OCI Creds Projects
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-cloud-oci-creds
  namespace: es
spec:
  provider:
    doppler:
      project: cloud-oci-creds
      config: prd
      auth:
        secretRef:
          dopplerToken:
            namespace: default
            name: doppler-token-auth-api
            key: dopplerToken
---
# ClusterSecretStore for Doppler Apps Creds Projects
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-apps-creds
  namespace: es
spec:
  provider:
    doppler:
      project: apps-creds
      config: prd
      auth:
        secretRef:
          dopplerToken:
            namespace: default
            name: doppler-token-auth-api
            key: dopplerToken
---
# ClusterSecretStore for the Cloudflare Creds Project. Holds the Cloudflare API
# token used by external-dns (DNS records) and Traefik (Let's Encrypt DNS
# challenge).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-cloudflare-creds
  namespace: es
spec:
  provider:
    doppler:
      project: cloudflare-creds
      config: prd
      auth:
        secretRef:
          dopplerToken:
            namespace: default
            name: doppler-token-auth-api
            key: dopplerToken

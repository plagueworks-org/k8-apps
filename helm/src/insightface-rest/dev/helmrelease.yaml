apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: insightface-rest
  namespace: face-verification
spec:
  driftDetection:
    mode: enabled
  interval: 5m

  chartRef:
    kind: OCIRepository
    name: plagueworks-helm-charts
    namespace: flux-system

  valuesFrom:
    - kind: ConfigMap
      name: insightface-rest-values
      valuesKey: values-01.yaml

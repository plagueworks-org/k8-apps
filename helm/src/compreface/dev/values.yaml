# Disable public-facing UI ingress — CompreFace is cluster-internal only
ingress:
  enabled: false

# Disable bundled PostgreSQL — using external DB at 10.18.20.10
postgresql:
  enabled: false

# External database connection
externalDatabase:
  host: "10.18.20.10"
  port: 5432
  database: compreface
  username: compreface
  existingSecret: compreface-db-secret
  existingSecretPasswordKey: POSTGRES_PASSWORD

# Image pull policy
global:
  imagePullPolicy: IfNotPresent

# API server resources
api:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

# Core (ML inference) resources
core:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

postgres:
  repository: docker.io/postgres
core:
  repository: docker.io/exadel/compreface-core
api:
  repository: docker.io/exadel/compreface-api
admin:
  repository: docker.io/exadel/compreface-admin
fe:
  repository: docker.io/exadel/compreface-fe

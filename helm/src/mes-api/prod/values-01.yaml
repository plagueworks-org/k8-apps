
# App name
name: mes-api

# Namespace
namespace:
  create: true
  name: mesapi
  labels:
    function: application
    category: api

# Replica
replicaCount: 1

# Image
image:
  repository: ghcr.io/mervinhemaraju/mauritius-emergency-service-api
  tag: prod
  pullPolicy: Always

# Container port
port: 8081

# Container envs
env:
  - name: UWSGI_PROTOCOL
    value: "http"
  - name: MAIL_USERNAME
    value: "mervinhemaraju@gmail.com"
  - name: MAIL_PASSWORD
    value: ""

# ConfigMap for data files
# configMap:
#   enabled: true
#   filesGlob: "data/v1/*.json"

# Volumes and mounts
volumes:
  - name: data-contacts
    configMap:
      name: mes-api-contacts
  - name: data-cyclone
    configMap:
      name: mes-api-cyclone
  - name: data-torrentialrain
    configMap:
      name: mes-api-torrentialrain
  - name: data-tsunami
    configMap:
      name: mes-api-tsunami

volumeMounts:
  - name: data-contacts
    mountPath: /app/data/v1/contacts
    readOnly: true
  - name: data-cyclone
    mountPath: /app/data/v1/cyclone
    readOnly: true
  - name: data-torrentialrain
    mountPath: /app/data/v1/torrentialrain
    readOnly: true
  - name: data-tsunami
    mountPath: /app/data/v1/tsunami
    readOnly: true

# Health checks
healthChecks:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Resources
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

# Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8081

# Ingress
ingress:
  enabled: true
  hosts:
    - host: mesapi.mervinhemaraju.com
    - host: mesapi.plagueworks.org
    # - host: mes.mervinhemaraju.com
    # - host: mes.plagueworks.org
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: le
  externalDns:
    enabled: true
    target: traefik-prod.plagueworks.org
    cloudflareProxied: "true"
    cloudflareComment: "MES API managed by ExternalDns in oke-prod-zeus-apps"

# Applies node affinity
nodeAffinity:
  enabled: true
  required:
    - key: node-pool
      operator: In
      values:
        - default-pool
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: koneksyon-api-release
  namespace: koneksyonapi
spec:
  driftDetection:
    mode: enabled
  interval: 5m
  chart:
    spec:
      chart: plagueworks-k8-standard-charts
      sourceRef:
        kind: OCIRepository
        name: plagueworks-helm-charts
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: koneksyon-api-values
      valuesKey: values-01.yaml
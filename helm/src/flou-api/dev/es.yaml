apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flou-api-appsettings-token
  namespace: flouapi
spec:
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: doppler-flou-creds
    kind: ClusterSecretStore

  # Describes the Kubernetes Secret that will be created
  target:
    name: flou-api-appsettings      # Name of the Kubernetes Secret to be created
    creationPolicy: Owner       # The secret will be deleted when this ExternalSecret is deleted

  # Describes the data to fetch from Doppler
  data:
  - secretKey: FLOU_API_APPSETTINGS
    remoteRef:
      key: FLOU_API_APPSETTINGS
      conversionStrategy: Default	
      decodingStrategy: None
      metadataPolicy: None
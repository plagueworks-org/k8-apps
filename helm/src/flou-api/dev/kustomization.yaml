apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flouapi

resources:
  - es.yaml
  - helmrelease.yaml

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: flou-api-values
  namespace: flouapi
  files:
  - values-01.yaml


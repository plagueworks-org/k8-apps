# App name
name: flou-api

# Namespace
namespace:
  create: false
  name: flouapi

# Replica
replicaCount: 1

# Image
image:
  repository: ghcr.io/zanbalak/flou-api
  tag: dev20260509-59c8e5e
  pullPolicy: Always

volumeMounts:
  - name: appsettings-secret
    mountPath: /app/appsettings.json # Path to your existing file
    subPath: FLOU_API_APPSETTINGS # The key from your secret
    readOnly: true

volumes:
  - name: appsettings-secret
    secret:
      secretName: flou-api-appsettings

# Container port
port: 8080

# Container envs
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Staging"
  - name: ASPNETCORE_URLS
    value: "http://+:8080"

# Deployment
deployment:
  imagePullSecrets:
    - name: ghcr-pull-secret

# Health checks
healthChecks:
  enabled: false

# Resources
resources:
  requests:
    cpu: "250m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress
ingress:
  enabled: true
  host: staging-flouapi.plagueworks.org
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: le
  externalDns:
    enabled: true
    target: traefik-dev.plagueworks.org
    cloudflareProxied: "true"
    cloudflareComment: "Flou API managed by ExternalDns in oke-dev-helios-apps"

# Applies node affinity
nodeAffinity:
  enabled: true
  required:
    - key: node-pool
      operator: In
      values:
        - default-pool

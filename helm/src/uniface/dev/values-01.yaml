# App name
name: uniface

# Namespace
namespace:
  create: false
  name: face-verification

# Replica
replicaCount: 1

# Image
image:
  repository: ghcr.io/plagueworks-org/uniface
  tag: latest
  pullPolicy: Always

# Container port
port: 8000

# Container envs
env:
  - name: UNIFACE_CACHE_DIR
    value: "/models"
  - name: REAL_THRESHOLD
    value: "0.85"
  - name: SPOOF_THRESHOLD
    value: "0.40"

# Deployment
deployment:
  imagePullSecrets:
    - name: ghcr-pull-secret

# Health checks
healthChecks:
  enabled: true
  liveness:
    enabled: true
    path: /healthz
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Resources
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"

# Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8000

# No ingress — internal only
ingress:
  enabled: false

# Applies node affinity
nodeAffinity:
  enabled: true
  required:
    - key: node-pool
      operator: In
      values:
        - default-pool


# App name
name: zedmo-api

# Namespace
namespace:
  # Created by namespace.yaml in this overlay, not by the chart. Both creating
  # it would leave Helm refusing to adopt a namespace it does not own.
  create: false
  name: zedmoapi

# Replica
replicaCount: 1

# Image
#
# `:prod` is built from main by push-package.yml in the zedmo repo. Each build
# is also tagged `:sha-<commit>`, which is what to pin here for a rollback.
image:
  repository: ghcr.io/mervinhemaraju/zedmo/api
  tag: prod
  pullPolicy: Always

# Container port
port: 8080

# Container envs
#
# The admin portal holds the Supabase SERVICE ROLE key, which bypasses RLS.
# Nothing sensitive is written here: every secret comes from Doppler through
# the ExternalSecret in es.yaml. This is the PROD project's key: a portal
# pointed at the wrong project writes puzzles into the wrong queue.
env:
  # Drives the dashboard's queue-depth warning. A target, not a limit.
  - name: QUEUE_DEPTH_TARGET_DAYS
    value: "30"

  # Which Supabase project this portal writes to, shown in the portal's
  # top-right badge. Required: the portal refuses to start without it. Set here
  # rather than in Doppler so the label follows the overlay it was deployed from.
  - name: ENVIRONMENT
    value: "prod"

  # Read-only view of the published GrowthBook flags on Game settings. Extracted
  # from Doppler's APP_CONFIG by the second ExternalSecret in es.yaml. The SDK
  # client key is public by design; GROWTHBOOK_HOST keeps its default,
  # https://cdn.growthbook.io.
  - name: GROWTHBOOK_CLIENT_KEY
    valueFrom:
      secretKeyRef:
        name: zedmo-api-growthbook
        key: GROWTHBOOK_CLIENT_KEY

  # Structured logs, so the cluster's collector gets JSON rather than prose.
  - name: LOG_JSON
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: LOG_JSON

  # The session cookie is Secure. Only a local plain-http run sets this false.
  - name: SECURE_COOKIES
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SECURE_COOKIES

  - name: SUPABASE_URL
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SUPABASE_URL

  - name: SUPABASE_SERVICE_ROLE_KEY
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SUPABASE_SERVICE_ROLE_KEY

  # Cloudflare Zero Trust Access is the only gate. The portal verifies the
  # Cf-Access-Jwt-Assertion header against Cloudflare's JWKS, checking the
  # issuer AND the audience; it never reads Cf-Access-Authenticated-User-Email,
  # which is an ordinary header that anyone reaching the origin directly can set
  # to whatever they like.
  #
  # Both values are published into Doppler by the cloudflare repo's 200-zta
  # component, so the AUD follows the Access application instead of being
  # copied from the dashboard and going quietly stale.
  #
  # No password fallback in prod (see es.yaml): the login route is not mounted.
  - name: CF_ACCESS_TEAM_DOMAIN
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: CF_ACCESS_TEAM_DOMAIN

  - name: CF_ACCESS_AUD
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: CF_ACCESS_AUD

# Deployment
deployment:
  imagePullSecrets:
    - name: ghcr-pull-secret

# Health checks
#
# /health is unauthenticated and deliberately empty, so probes do not need to
# pass whatever gate is in front of the portal.
#
# The path is NOT configurable: the chart renders both probes against /health
# and ignores an override here. It is written out anyway so the two files agree
# about what is being hit.
healthChecks:
  enabled: true
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Resources
#
# A single-operator internal portal: a handful of requests per authoring
# session, against a table that grows by four rows a day.
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "150m"
    memory: "128Mi"

# Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress
#
# cloudflareProxied stays true: Access only sits in front of proxied records,
# and it keeps the origin IP out of DNS.
ingress:
  enabled: true
  host: zedmoapi.plagueworks.org
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: le
  externalDns:
    enabled: true
    target: traefik-prod.plagueworks.org
    cloudflareProxied: "true"
    cloudflareComment: "Zedmo Admin API managed by ExternalDns in oke-prod-zeus-apps"

# Applies node affinity
nodeAffinity:
  enabled: true
  required:
    - key: node-pool
      operator: In
      values:
        - default-pool

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zedmo-api-config-token
  namespace: zedmoapi
spec:
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: doppler-zedmo-creds
    kind: ClusterSecretStore

  # Describes the Kubernetes Secret that will be created
  target:
    name: zedmo-api-config      # Name of the Kubernetes Secret to be created
    creationPolicy: Owner       # The secret will be deleted when this ExternalSecret is deleted

  # Describes the data to fetch from Doppler
  #
  # SUPABASE_SERVICE_ROLE_KEY bypasses Row Level Security entirely, which is
  # what protects the hand-authored puzzle queue. It belongs to this service and
  # to the developer's local tooling, nowhere else. If it ever leaks it is
  # compromised: rotate it in Supabase, do not just remove it from Doppler.
  data:
  - secretKey: SUPABASE_URL
    remoteRef:
      key: SUPABASE_URL
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  - secretKey: SUPABASE_SERVICE_ROLE_KEY
    remoteRef:
      key: SUPABASE_SERVICE_ROLE_KEY
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      
  - secretKey: ADMIN_PASSWORD_HASH
    remoteRef:
      key: ADMIN_PASSWORD_HASH
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  - secretKey: ADMIN_SESSION_SECRET
    remoteRef:
      key: ADMIN_SESSION_SECRET
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  - secretKey: LOG_JSON
    remoteRef:
      key: LOG_JSON
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  - secretKey: SECURE_COOKIES
    remoteRef:
      key: SECURE_COOKIES
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  # Written into the zedmo Doppler project by the cloudflare repo's 200-zta
  # component, so the AUD cannot go stale by being copied from the dashboard.
  - secretKey: CF_ACCESS_TEAM_DOMAIN
    remoteRef:
      key: CF_ACCESS_TEAM_DOMAIN
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

  - secretKey: CF_ACCESS_AUD
    remoteRef:
      key: CF_ACCESS_AUD
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

---
# Only the GrowthBook client key, taken out of APP_CONFIG (the app's env file as
# JSON), so the portal shows the flags of the same SDK connection the app reads
# from one copy in Doppler, without the rest of the app config reaching this pod.
#
# A separate ExternalSecret and Secret on purpose: a template replaces the target
# Secret's data with only the templated keys, so on the main ExternalSecret it
# would have to re-template every other key. `remoteRef.property` is not used:
# the Doppler provider ignored it and stored the whole document.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zedmo-api-growthbook-token
  namespace: zedmoapi
spec:
  # Reference to the ClusterSecretStore
  secretStoreRef:
    name: doppler-zedmo-creds
    kind: ClusterSecretStore

  target:
    name: zedmo-api-growthbook
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Public by design (the app ships it). Empty if APP_CONFIG has no key,
        # which the portal shows as "Not configured".
        GROWTHBOOK_CLIENT_KEY: '{{ (.appConfig | fromJson).GROWTHBOOK_CLIENT_KEY | default "" }}'

  data:
  - secretKey: appConfig
    remoteRef:
      key: APP_CONFIG
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None

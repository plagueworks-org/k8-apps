
# App name
name: zedmo-api

# Namespace
namespace:
  # Created by namespace.yaml in this overlay, not by the chart. Both creating
  # it would leave Helm refusing to adopt a namespace it does not own.
  create: false
  name: zedmoapi

# Replica
replicaCount: 1

# Image
image:
  repository: ghcr.io/mervinhemaraju/zedmo/api
  tag: dev
  pullPolicy: Always

# Container port
port: 8080

# Container envs
#
# The admin portal holds the Supabase SERVICE ROLE key, which bypasses RLS.
# Nothing sensitive is written here: every secret comes from Doppler through
# the ExternalSecret in es.yaml.
env:
  # Drives the dashboard's queue-depth warning. A target, not a limit.
  - name: QUEUE_DEPTH_TARGET_DAYS
    value: "30"

  # Structured logs, so the cluster's collector gets JSON rather than prose.
  - name: LOG_JSON
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: LOG_JSON

  # The session cookie is Secure. Only a local plain-http run sets this false.
  - name: SECURE_COOKIES
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SECURE_COOKIES

  - name: SUPABASE_URL
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SUPABASE_URL

  - name: SUPABASE_SERVICE_ROLE_KEY
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: SUPABASE_SERVICE_ROLE_KEY

  - name: ADMIN_PASSWORD_HASH
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: ADMIN_PASSWORD_HASH

  - name: ADMIN_SESSION_SECRET
    valueFrom:
      secretKeyRef:
        name: zedmo-api-config
        key: ADMIN_SESSION_SECRET

  # CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD are absent until Zero Trust exists.
  #
  # Know what that costs while it lasts: a shared password on a public
  # hostname, with no rate limiting in front of it beyond Cloudflare's, standing
  # between the internet and a service holding the Supabase service role key.
  # Use a long random password, and treat this as temporary rather than as the
  # arrangement. When Access is attached, add the two CF_ACCESS values (here and
  # in es.yaml) and REMOVE these two: with the fallback unconfigured the login
  # route is not mounted at all, so there is no form to attack and no shared
  # secret to leak.
  #
  # The service refuses to start with neither auth path configured, so a
  # half-finished switch crash-loops rather than serving the authored puzzle
  # queue unauthenticated.

# Deployment
deployment:
  imagePullSecrets:
    - name: ghcr-pull-secret

# Health checks
#
# /healthz is unauthenticated and deliberately empty, so probes do not need to
# pass the Access gate.
healthChecks:
  enabled: true
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Resources
#
# A single-operator internal portal: a handful of requests per authoring
# session, against a table that grows by four rows a day.
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "150m"
    memory: "128Mi"

# Service
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress
#
# cloudflareProxied stays true. It keeps the origin IP out of DNS while the
# only gate is a password, and it is also what Cloudflare Zero Trust Access
# will need later: Access only sits in front of proxied records.
ingress:
  enabled: true
  host: zedmoapi-dev.tropikode.com
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: le
  externalDns:
    enabled: true
    target: traefik-dev.plagueworks.org
    cloudflareProxied: "true"
    cloudflareComment: "Zedmo Admin API managed by ExternalDns in oke-dev-helios-apps"

# Applies node affinity
nodeAffinity:
  enabled: true
  required:
    - key: node-pool
      operator: In
      values:
        - default-pool

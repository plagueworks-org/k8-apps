apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zedmo-api-release
  namespace: zedmoapi
spec:
  driftDetection:
    mode: enabled
  interval: 5m

  # The shared chart, already mirrored into the cluster as an OCIRepository
  # pinned to 1.1.0. Flux resolves the chart itself; kustomize never inflates it.
  chartRef:
    kind: OCIRepository
    name: plagueworks-helm-charts
    namespace: flux-system

  valuesFrom:
    - kind: ConfigMap
      name: zedmo-api-values
      valuesKey: values-01.yaml
